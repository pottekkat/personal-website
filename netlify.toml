# Hugo re-encodes every content image to WebP on a cold cache, which is several
# minutes of build time. resources/ is gitignored, so without this every deploy
# starts from zero; the plugin restores it between builds and `hugo --gc` prunes
# variants that are no longer referenced.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["resources"]

[context.deploy-preview]
    command = "hugo --buildFuture --buildDrafts --gc --minify -b $DEPLOY_PRIME_URL"

[[redirects]]
  from = "/featured"
  to = "/categories/featured/"

[[redirects]]
  from = "/github"
  to = "https://github.com/pottekkat"

[[redirects]]
  from = "/linkedin"
  to = "https://www.linkedin.com/in/realPottekkat/"

[[redirects]]
  from = "/youtube"
  to = "https://youtube.com/@realPottekkat"

[[redirects]]
  from = "/resume"
  to = "https://drive.google.com/file/d/1NtoLtc5KO9n7UBymoZ9LVg-zNUiiuNaW/view?usp=sharing"

[[redirects]]
  from = "/twitter"
  to = "https://twitter.com/realPottekkat"

[[redirects]]
  from = "/tfjs-object-detection"
  to = "https://github.com/pottekkat/tfjs-object-detection"

[[redirects]]
  from = "/misc/js/script.js"
  to = "https://plausible.io/js/script.js"
  status = 200

[[redirects]]
  from = "/misc/api/event"
  to = "https://plausible.io/api/event"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"