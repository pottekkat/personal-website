name: Update Changelog

on:
  push:
    branches:
      - hugo
  workflow_dispatch:

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: hugo
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18.x

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > generate-changelog.js << 'SCRIPT_EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          async function generateChangelog() {
            try {
              const dataDir = 'data/changelog';
              const dataFile = path.join(dataDir, 'entries.json');

              let existingData = null;
              let lastCommitHash = null;

              if (fs.existsSync(dataFile)) {
                existingData = JSON.parse(fs.readFileSync(dataFile, 'utf8'));
                if (existingData.entries && existingData.entries.length > 0) {
                  lastCommitHash = existingData.entries[0].hash;
                }
              }

              let gitLogCommand = 'git log --author="pottekkat" --pretty=format:"%H|%at|%s" --name-status';
              if (lastCommitHash) {
                gitLogCommand = 'git log --author="pottekkat" ' + lastCommitHash + '..HEAD --pretty=format:"%H|%at|%s" --name-status';
              }

              const gitLog = execSync(gitLogCommand, { encoding: 'utf8' });

              if (!gitLog.trim()) {
                console.log('No new commits to process');
                return;
              }

              const commits = [];
              const lines = gitLog.split('\n');
              let currentCommit = null;

              for (const line of lines) {
                if (line.includes('|')) {
                  if (currentCommit) commits.push(currentCommit);
                  const parts = line.split('|');
                  const hash = parts[0];
                  const timestamp = parts[1];
                  const subject = parts[2];
                  currentCommit = {
                    hash: hash,
                    date: new Date(parseInt(timestamp) * 1000).toISOString().split('T')[0],
                    subject: subject,
                    files: []
                  };
                } else if (currentCommit && line.trim()) {
                  const match = line.match(/^([AMD])\s+(.+)$/);
                  if (match) {
                    currentCommit.files.push({
                      status: match[1],
                      path: match[2]
                    });
                  }
                }
              }
              if (currentCommit) commits.push(currentCommit);

              console.log('Processing ' + commits.length + ' new commits...');

              const batchSize = 10;
              const newEntries = [];

              for (let i = 0; i < commits.length; i += batchSize) {
                const batch = commits.slice(i, i + batchSize);

                const commitList = batch.map(function(c) {
                  return 'Hash: ' + c.hash.substring(0, 7) + '\nSubject: ' + c.subject + '\nFiles: ' + c.files.map(function(f) { return f.path; }).join(', ');
                }).join('\n\n');

                const analysisPrompt = 'Generate a short, clear explanation (max 10-15 words) for each git commit below.\nBe concise and user-friendly. Focus on what changed, not technical details.\n\nCommits:\n' + commitList + '\n\nReturn a JSON array with one object per commit:\n[\n  {\n    "hash": "full_commit_hash",\n    "explanation": "Short explanation"\n  }\n]\n\nReturn ONLY valid JSON, no markdown or explanations.';

                const response = await fetch(
                  'https://models.inference.ai.azure.com/chat/completions',
                  {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN
                    },
                    body: JSON.stringify({
                      messages: [
                        {
                          role: 'system',
                          content: 'You are a helpful assistant that generates concise commit explanations. Always respond with valid JSON only.'
                        },
                        {
                          role: 'user',
                          content: analysisPrompt
                        }
                      ],
                      model: 'gpt-4o',
                      temperature: 0.3,
                      max_tokens: 1000
                    })
                  }
                );

                if (!response.ok) {
                  const errorText = await response.text();
                  throw new Error('GitHub Models API failed: ' + response.status + ' ' + errorText);
                }

                const result = await response.json();
                const aiResponse = result.choices[0].message.content.trim();

                let batchEntries;
                const jsonMatch = aiResponse.match(/\[[\s\S]*\]/);
                if (jsonMatch) {
                  batchEntries = JSON.parse(jsonMatch[0]);
                } else {
                  batchEntries = JSON.parse(aiResponse);
                }

                for (const entry of batchEntries) {
                  const commit = batch.find(function(c) { return c.hash === entry.hash; });
                  if (commit) {
                    newEntries.push({
                      hash: entry.hash,
                      date: commit.date,
                      message: entry.explanation
                    });
                  }
                }
              }

              let allEntries = newEntries;
              if (existingData && existingData.entries) {
                allEntries = newEntries.concat(existingData.entries);
              }

              const changelog = {
                lastUpdated: new Date().toISOString(),
                entries: allEntries
              };

              if (!fs.existsSync(dataDir)) {
                fs.mkdirSync(dataDir, { recursive: true });
              }

              fs.writeFileSync(
                dataFile,
                JSON.stringify(changelog, null, 2) + '\n'
              );

              console.log('Changelog updated: ' + newEntries.length + ' new entries, ' + allEntries.length + ' total');
            } catch (error) {
              console.error('Failed to generate changelog:', error.message);
              process.exit(1);
            }
          }

          generateChangelog();
          SCRIPT_EOF
          node generate-changelog.js

      - name: Commit changelog
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/changelog/entries.json
          git diff-index --quiet HEAD || git commit -m "update changelog"

      - name: Push changes
        uses: ad-m/github-push-action@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: hugo
