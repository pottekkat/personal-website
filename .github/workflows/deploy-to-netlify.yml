name: Deploy to Netlify

on:
  workflow_call:

jobs:
  deploy:
    name: Build and Deploy to Netlify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: hugo
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          # Hugo re-encodes every content image to WebP on a cold cache, which
          # takes several minutes. resources/ is gitignored, so without this
          # every run starts from zero. The key changes when an image or the
          # template that processes it changes; `hugo --gc` prunes variants
          # that are no longer referenced.
          path: resources
          key: hugo-resources-${{ runner.os }}-0.154.5-${{ hashFiles('static/images/**', 'assets/images/**', 'layouts/partials/responsive-image.html') }}
          restore-keys: |
            hugo-resources-${{ runner.os }}-0.154.5-

      - name: Build
        env:
          HUGO_ENV: production
        run: hugo --gc --minify

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@17.x

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          netlify deploy --dir=public --prod --message "hugo@${COMMIT_HASH}: ${COMMIT_MSG}"
