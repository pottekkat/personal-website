name: Update Data and Deploy

on:
  push:
    branches:
      - hugo
  workflow_dispatch:

concurrency:
  group: hugo-branch-updates
  cancel-in-progress: false

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: hugo
          fetch-depth: 0
          lfs: true

      - name: Generate changelog
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            // Set timezone to IST for all Date operations
            process.env.TZ = 'Asia/Kolkata';

            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            async function generateChangelog() {
              try {
                const dataDir = 'data/changelog';
                const dataFile = path.join(dataDir, 'entries.json');

                let existingData = null;
                let lastCommitHash = null;

                if (fs.existsSync(dataFile)) {
                  existingData = JSON.parse(fs.readFileSync(dataFile, 'utf8'));
                  if (existingData.entries && existingData.entries.length > 0) {
                    lastCommitHash = existingData.entries[0].hash;
                  }
                }

                // Fetch commits from GitHub API (only from pottekkat)
                const allCommits = await github.rest.repos.listCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  author: 'pottekkat',
                  per_page: lastCommitHash ? 100 : 5
                });

                let commits = allCommits.data;

                // Filter to only new commits if we have existing data
                if (lastCommitHash) {
                  const lastIndex = commits.findIndex(c => c.sha.startsWith(lastCommitHash));
                  if (lastIndex > 0) {
                    commits = commits.slice(0, lastIndex);
                  } else {
                    commits = [];
                  }
                }

                // Exclude merge commits (commits with multiple parents)
                commits = commits.filter(c => c.parents.length === 1);

                if (commits.length === 0) {
                  console.log('No new commits to process');
                  return;
                }

                console.log('Processing ' + commits.length + ' new commits...');

                const batchSize = 3;
                const newEntries = [];

                for (let i = 0; i < commits.length; i += batchSize) {
                  const batch = commits.slice(i, i + batchSize);

                  // Fetch full commit details with diffs
                  const commitDetails = await Promise.all(
                    batch.map(c =>
                      github.rest.repos.getCommit({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: c.sha
                      })
                    )
                  );

                  // Prepare commit data for AI, excluding changelog-only commits
                  const commitList = commitDetails
                    .filter(detail => {
                      const files = detail.data.files || [];
                      // Skip if only file changed is the changelog data file
                      if (files.length === 1 && files[0].filename === 'data/changelog/entries.json') {
                        console.log('Skipping changelog-only commit:', detail.data.sha.substring(0, 7));
                        return false;
                      }
                      return true;
                    })
                    .map(detail => {
                    const commit = detail.data;

                    // Filter out very large files and truncate patches more aggressively
                    const filteredFiles = commit.files
                      .filter(f => {
                        // Skip large binary files, generated files, and lock files
                        const skipPatterns = ['.lock', '.sum', 'package-lock.json', 'yarn.lock', 'resources/_gen', 'static/images'];
                        return !skipPatterns.some(pattern => f.filename.includes(pattern));
                      })
                      .slice(0, 10)  // Limit to first 10 files max
                      .map(f => {
                        // Truncate patch to first 200 characters to avoid token limit
                        let patch = f.patch || '';
                        if (patch.length > 200) {
                          patch = patch.substring(0, 200) + '\n... (truncated)';
                        }
                        return {
                          filename: f.filename,
                          status: f.status,
                          additions: f.additions,
                          deletions: f.deletions,
                          patch: patch
                        };
                      });

                    return {
                      hash: commit.sha.substring(0, 7),
                      message: commit.commit.message.split('\n')[0],
                      files: filteredFiles
                    };
                  });

                  // Skip this batch if all commits were changelog-only
                  if (commitList.length === 0) {
                    console.log('Batch contained only changelog-only commits, skipping...');
                    continue;
                  }

                  const systemPrompt = 'You are a helpful assistant that generates concise commit explanations for a changelog. Always respond with valid JSON only.';

                  const userPrompt = 'Generate a short, clear explanation (max 10-15 words) for each git commit below. Be concise and user-friendly. Focus on what changed, not technical details. You can use `code fences` if needed, no other Markdown formatting is allowed.\n\nCommits:\n' + JSON.stringify(commitList, null, 2) + '\n\nReturn response in this exact format.';

                  const response = await fetch(
                    'https://models.inference.ai.azure.com/chat/completions',
                    {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN
                      },
                      body: JSON.stringify({
                        messages: [
                          {
                            role: 'system',
                            content: systemPrompt
                          },
                          {
                            role: 'user',
                            content: userPrompt
                          }
                        ],
                        model: 'gpt-4o',
                        temperature: 0.3,
                        max_tokens: 1000,
                        response_format: {
                          type: 'json_schema',
                          json_schema: {
                            name: 'changelog_entries',
                            strict: true,
                            schema: {
                              type: 'object',
                              properties: {
                                entries: {
                                  type: 'array',
                                  items: {
                                    type: 'object',
                                    properties: {
                                      hash: {
                                        type: 'string',
                                        description: 'The commit hash (7 chars), same as provided in the input.'
                                      },
                                      explanation: {
                                        type: 'string',
                                        description: 'Short explanation of the commit, do not copy the commit message, the commit message might be added lazily by the developer and might not reflect the actual changes, so generate a proper explanation based on the code changes.'
                                      }
                                    },
                                    required: ['hash', 'explanation'],
                                    additionalProperties: false
                                  }
                                }
                              },
                              required: ['entries'],
                              additionalProperties: false
                            }
                          }
                        }
                      })
                    }
                  );

                  if (!response.ok) {
                    const errorText = await response.text();
                    console.error('GitHub Models API failed for batch:', response.status, errorText);
                    // Skip this batch if token limit is reached, but continue with other batches
                    if (response.status === 413) {
                      console.log('Skipping batch due to token limit, continuing with remaining commits...');
                      continue;
                    }
                    throw new Error('GitHub Models API failed: ' + response.status + ' ' + errorText);
                  }

                  const result = await response.json();
                  const aiResponse = JSON.parse(result.choices[0].message.content);

                  for (const entry of aiResponse.entries) {
                    const commit = commitDetails.find(c =>
                      c.data.sha.startsWith(entry.hash)
                    );
                    if (commit) {
                      // Get original commit timestamp with timezone using git
                      const commitTimestamp = execSync(
                        'git show -s --format=%cI ' + commit.data.sha,
                        { encoding: 'utf8' }
                      ).trim();

                      newEntries.push({
                        hash: commit.data.sha.substring(0, 7),
                        date: commitTimestamp,
                        message: entry.explanation
                      });
                    } else {
                      console.log('Warning: Could not match hash:', entry.hash);
                    }
                  }

                  // Rate limit: wait 12 seconds between batches (5 requests per minute)
                  if (i + batchSize < commits.length) {
                    await new Promise(resolve => setTimeout(resolve, 12000));
                  }
                }

                let allEntries = newEntries;
                if (existingData && existingData.entries) {
                  allEntries = [...newEntries, ...existingData.entries];
                }

                // Get current timestamp in IST with timezone offset
                const lastUpdated = execSync('TZ=Asia/Kolkata date -Iseconds', { encoding: 'utf8' }).trim();

                const changelog = {
                  lastUpdated: lastUpdated,
                  entries: allEntries
                };

                if (!fs.existsSync(dataDir)) {
                  fs.mkdirSync(dataDir, { recursive: true });
                }

                fs.writeFileSync(
                  dataFile,
                  JSON.stringify(changelog, null, 2) + '\n'
                );

                console.log('Changelog updated: ' + newEntries.length + ' new entries, ' + allEntries.length + ' total');
              } catch (error) {
                console.error('Failed to generate changelog:', error.message);
                console.error(error.stack);
                core.setFailed(error.message);
              }
            }

            await generateChangelog();

      - name: Commit changelog
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/changelog/entries.json
          git diff-index --quiet HEAD || git commit -m "update changelog"

      - name: Push changes
        uses: ad-m/github-push-action@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: hugo

  lighthouse:
    name: Run Lighthouse
    runs-on: ubuntu-latest
    needs: changelog
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: hugo
          submodules: true
          fetch-depth: 0
          lfs: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true

      - name: Build
        env:
          HUGO_ENV: development
        run: hugo --gc --minify

      - name: Use Node.js 18.x
        uses: actions/setup-node@v6
        with:
          node-version: 18.x

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci collect

      - name: Extract and format scores
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          try {
            const lhciDir = '.lighthouseci';
            const files = fs.readdirSync(lhciDir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));

            if (files.length === 0) {
              throw new Error('No Lighthouse reports found');
            }

            // Read all reports and extract scores
            const allScores = files.map(file => {
              const results = JSON.parse(fs.readFileSync(path.join(lhciDir, file), 'utf8'));
              return {
                performance: Math.round(results.categories.performance.score * 100),
                accessibility: Math.round(results.categories.accessibility.score * 100),
                bestPractices: Math.round(results.categories['best-practices'].score * 100),
                seo: Math.round(results.categories.seo.score * 100)
              };
            });

            // Calculate median scores across all runs
            const median = (arr) => {
              const sorted = arr.sort((a, b) => a - b);
              const mid = Math.floor(sorted.length / 2);
              return sorted.length % 2 !== 0 ? sorted[mid] : Math.round((sorted[mid - 1] + sorted[mid]) / 2);
            };

            // Get current timestamp in IST with timezone offset
            const lastUpdated = execSync('TZ=Asia/Kolkata date -Iseconds', { encoding: 'utf8' }).trim();

            const scores = {
              lastUpdated: lastUpdated,
              performance: median(allScores.map(s => s.performance)),
              accessibility: median(allScores.map(s => s.accessibility)),
              bestPractices: median(allScores.map(s => s.bestPractices)),
              seo: median(allScores.map(s => s.seo))
            };

            const dataDir = 'data/lighthouse';
            if (!fs.existsSync(dataDir)) {
              fs.mkdirSync(dataDir, { recursive: true });
            }

            fs.writeFileSync(
              path.join(dataDir, 'scores.json'),
              JSON.stringify(scores, null, 2) + '\n'
            );

            console.log('Lighthouse scores updated (median of', files.length, 'runs):', scores);
          } catch (error) {
            console.error('Failed to extract scores:', error.message);
            process.exit(1);
          }
          EOF

      - name: Commit scores
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/lighthouse/scores.json
          git diff-index --quiet HEAD || git commit -m "update lighthouse scores"

      - name: Push changes
        uses: ad-m/github-push-action@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: hugo

  deploy:
    name: Trigger Netlify Deploy
    runs-on: ubuntu-latest
    needs: [changelog, lighthouse]
    if: always()  # Run even if changelog or lighthouse fail
    steps:
      - name: Trigger Netlify Build
        run: |
          curl -X POST -d '{}' ${{ secrets.NETLIFY_BUILD_HOOK }}
