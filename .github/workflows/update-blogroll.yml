name: Update Blogroll Latest Posts

on:
  workflow_call:
  workflow_dispatch:

jobs:
  update-blogroll:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: hugo

      - name: Pull latest changes
        run: git pull origin hugo

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
          
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/blogroll-scripts/requirements.txt
          
      - name: Execute Python script
        run: python .github/blogroll-scripts/update_blogroll.py
          
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/blogroll/latest.json
          git diff-index --quiet HEAD || (git commit -m "update blogroll latest posts" --allow-empty)
          
      - name: Push changes
        run: |
          for i in 1 2 3 4 5; do
            git pull --rebase origin hugo && git push origin hugo && exit 0
            echo "Push attempt $i failed (remote moved), retrying..."
            sleep 5
          done
          echo "::error::Failed to push to hugo after 5 attempts"
          exit 1

  # Deploy job removed - parent workflow (scheduled-updates) handles deployment
