name: Lighthouse CI

on:
  push:
    branches:
      - hugo
  workflow_dispatch:

jobs:
  lighthouse:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: hugo

      - name: Wait for Netlify deployment
        run: |
          echo "Waiting 5 minutes for Netlify to deploy..."
          sleep 1
          echo "Deployment should be complete, verifying site is accessible..."

          # Verify the site is accessible
          if curl -s -o /dev/null -w "%{http_code}" https://navendu.me/ | grep -q "200"; then
            echo "Site is live and ready for Lighthouse!"
          else
            echo "Warning: Site may not be fully deployed yet, but proceeding anyway..."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Run Lighthouse CI
        run: |
          lhci autorun --collect.url=https://navendu.me/ --collect.numberOfRuns=1
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Extract and format scores
        run: |
          echo "Checking for Lighthouse reports..."
          ls -la .lighthouseci/ || echo "Directory doesn't exist"

          echo "Running extraction script..."
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          try {
            console.log('Looking for Lighthouse reports...');

            // Find the latest Lighthouse report
            const lhciDir = '.lighthouseci';

            if (!fs.existsSync(lhciDir)) {
              console.error('ERROR: .lighthouseci directory does not exist!');
              process.exit(1);
            }

            const files = fs.readdirSync(lhciDir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
            console.log(`Found ${files.length} report file(s):`, files);

            if (files.length === 0) {
              console.error('ERROR: No Lighthouse reports found!');
              process.exit(1);
            }

            // Read the first report
            const reportPath = path.join(lhciDir, files[0]);
            console.log('Reading report from:', reportPath);
            const results = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const scores = {
              lastUpdated: new Date().toISOString(),
              performance: Math.round(results.categories.performance.score * 100),
              accessibility: Math.round(results.categories.accessibility.score * 100),
              bestPractices: Math.round(results.categories['best-practices'].score * 100),
              seo: Math.round(results.categories.seo.score * 100)
            };

            console.log('Extracted scores:', scores);

            // Create directory if it doesn't exist
            const dataDir = 'data/lighthouse';
            if (!fs.existsSync(dataDir)) {
              console.log('Creating data directory:', dataDir);
              fs.mkdirSync(dataDir, { recursive: true });
            }

            // Write scores
            const outputPath = path.join(dataDir, 'scores.json');
            fs.writeFileSync(
              outputPath,
              JSON.stringify(scores, null, 2) + '\n'
            );

            console.log('Successfully wrote scores to:', outputPath);
            console.log('Final scores:', scores);
          } catch (error) {
            console.error('ERROR in extraction script:', error.message);
            console.error(error.stack);
            process.exit(1);
          }
          EOF

          echo "Extraction complete, checking output..."
          cat data/lighthouse/scores.json || echo "Failed to create scores file"

      - name: Commit scores
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/lighthouse/scores.json
          git diff-index --quiet HEAD || git commit -m "update lighthouse scores"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: hugo
