name: Lighthouse Performance Testing

on:
  schedule:
    - cron: '0 0 * * 0'  # Run every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  lighthouse:
    name: Run Lighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: hugo
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          # Hugo re-encodes every content image to WebP on a cold cache, which
          # takes several minutes. resources/ is gitignored, so without this
          # every run starts from zero. The key changes when an image or the
          # template that processes it changes; `hugo --gc` prunes variants
          # that are no longer referenced.
          path: resources
          key: hugo-resources-${{ runner.os }}-0.154.5-${{ hashFiles('static/images/**', 'assets/images/**', 'layouts/partials/responsive-image.html') }}
          restore-keys: |
            hugo-resources-${{ runner.os }}-0.154.5-

      - name: Build
        env:
          HUGO_ENV: development
        run: |
          sed -i 's/defaultTheme: "auto"/defaultTheme: "dark"/' config.yml
          hugo --gc --minify

      - name: Use Node.js 18.x
        uses: actions/setup-node@v6
        with:
          node-version: 18.x

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci collect

      - name: Extract and format scores
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          try {
            const lhciDir = '.lighthouseci';
            const files = fs.readdirSync(lhciDir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));

            if (files.length === 0) {
              throw new Error('No Lighthouse reports found');
            }

            // Read all reports and extract scores
            const allScores = files.map(file => {
              const results = JSON.parse(fs.readFileSync(path.join(lhciDir, file), 'utf8'));
              return {
                performance: Math.round(results.categories.performance.score * 100),
                accessibility: Math.round(results.categories.accessibility.score * 100),
                bestPractices: Math.round(results.categories['best-practices'].score * 100),
                seo: Math.round(results.categories.seo.score * 100)
              };
            });

            // Calculate median scores across all runs
            const median = (arr) => {
              const sorted = arr.sort((a, b) => a - b);
              const mid = Math.floor(sorted.length / 2);
              return sorted.length % 2 !== 0 ? sorted[mid] : Math.round((sorted[mid - 1] + sorted[mid]) / 2);
            };

            // Get current timestamp in IST with timezone offset
            const lastUpdated = execSync('TZ=Asia/Kolkata date -Iseconds', { encoding: 'utf8' }).trim();

            const scores = {
              lastUpdated: lastUpdated,
              performance: median(allScores.map(s => s.performance)),
              accessibility: median(allScores.map(s => s.accessibility)),
              bestPractices: median(allScores.map(s => s.bestPractices)),
              seo: median(allScores.map(s => s.seo))
            };

            const dataDir = 'data/lighthouse';
            if (!fs.existsSync(dataDir)) {
              fs.mkdirSync(dataDir, { recursive: true });
            }

            fs.writeFileSync(
              path.join(dataDir, 'scores.json'),
              JSON.stringify(scores, null, 2) + '\n'
            );

            console.log('Lighthouse scores updated (median of', files.length, 'runs):', scores);

            // Log failing audits across categories for debugging
            const firstReport = JSON.parse(fs.readFileSync(path.join(lhciDir, files[0]), 'utf8'));
            ['accessibility', 'best-practices', 'performance', 'seo'].forEach(catId => {
              const refs = firstReport.categories[catId].auditRefs.filter(r => r.weight > 0);
              const failing = refs.filter(ref => {
                const audit = firstReport.audits[ref.id];
                return audit && audit.score !== null && audit.score < 1;
              });
              if (failing.length > 0) {
                console.log(`\nFailing ${catId} audits:`);
                failing.forEach(ref => {
                  const audit = firstReport.audits[ref.id];
                  console.log(`  - ${ref.id} (weight: ${ref.weight}, score: ${audit.score}): ${audit.title}`);
                  if (audit.displayValue) console.log(`    ${audit.displayValue}`);
                  if (audit.details && audit.details.items) {
                    audit.details.items.slice(0, 5).forEach(item => {
                      console.log(`    Item: ${item.node ? item.node.snippet : JSON.stringify(item).slice(0, 300)}`);
                    });
                  }
                });
              }
            });
          } catch (error) {
            console.error('Failed to extract scores:', error.message);
            process.exit(1);
          }
          EOF

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

      - name: Commit scores
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/lighthouse/scores.json
          git diff-index --quiet HEAD || git commit -m "update lighthouse scores"

      - name: Push changes
        run: |
          for i in 1 2 3 4 5; do
            git pull --rebase origin hugo && git push origin hugo && exit 0
            echo "Push attempt $i failed (remote moved), retrying..."
            sleep 5
          done
          echo "::error::Failed to push to hugo after 5 attempts"
          exit 1
