name: Update Stats

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: macos-latest
    steps:

      - name: get current date and time
        run: echo "RUN=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV

      - name: checkout repo
        uses: actions/checkout@v6
        with:
          ref: hugo

      - name: Pull latest changes
        run: git pull origin hugo

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r ./.github/requirements.txt
          
      - name: execute python script
        env:
          SITE: navendu.me
          PERIOD: 30d
          TOKEN: ${{ secrets.PLAUSIBLE_TOKEN }}
        run: python ./.github/main.py

      # run fetchCommits.js and commit just the generated commitsData.json file
      - name: fetch commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --prefix ./.github
          node ./.github/fetchCommits.js
          
      - name: commit files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "update stats" --allow-empty)
          
      - name: push changes
        run: |
          for i in 1 2 3 4 5; do
            git pull --rebase origin hugo && git push origin hugo && exit 0
            echo "Push attempt $i failed (remote moved), retrying..."
            sleep 5
          done
          echo "::error::Failed to push to hugo after 5 attempts"
          exit 1

  # Deploy job removed - parent workflow (scheduled-updates) handles deployment
