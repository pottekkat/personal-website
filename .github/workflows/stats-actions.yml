name: Update Stats

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: macos-latest
    steps:

      - name: Ensure pkgconf is properly linked
        run: |
          if brew list pkg-config@0.29.2 &>/dev/null; then
            brew unlink pkg-config@0.29.2
          fi
          if ! brew list pkgconf &>/dev/null; then
            brew install pkgconf
          fi
          brew link --overwrite pkgconf

      - name: install gdal
        # Pin GDAL to 3.13.1 via a specific homebrew-core commit to prevent
        # version drift. The pip GDAL binding below must match this version.
        # Modern Homebrew no longer accepts a URL argument, so download the
        # pinned formula file and install from it (still pours the bottle).
        run: |
          curl -fsSL https://raw.githubusercontent.com/Homebrew/homebrew-core/9d61e684c68e7b93fc477aa0f391de697adae249/Formula/g/gdal.rb -o /tmp/gdal.rb
          brew install --force --overwrite /tmp/gdal.rb

      - name: get current date and time
        run: echo "RUN=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV

      - name: checkout repo
        uses: actions/checkout@v2
        with:
          ref: hugo

      - name: Pull latest changes
        run: git pull origin hugo

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.11'
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install gdal==3.13.1
          pip install -r ./.github/requirements.txt
          
      - name: execute python script
        env:
          SITE: navendu.me
          PERIOD: 30d
          TOKEN: ${{ secrets.PLAUSIBLE_TOKEN }}
        run: python ./.github/main.py

      # run fetchCommits.js and commit just the generated commitsData.json file
      - name: fetch commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --prefix ./.github
          node ./.github/fetchCommits.js
          
      - name: commit files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "update stats" --allow-empty)
          
      - name: push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: hugo

  # Deploy job removed - parent workflow (scheduled-updates) handles deployment
