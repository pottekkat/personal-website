# This workflow is disabled and the website is now deployed on Netlify
name: Build and Publish Website

on:
  push:
    branches:
      - hugo  # Set a branch to deploy
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '24 3 * * *' # Run everyday at 8:54 PM IST (3:24 PM UTC)

jobs:
  build-and-publish:
    runs-on: ubuntu-20.04
    name: Build and Publish Website
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          # extended: true

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          # Hugo re-encodes every content image to WebP on a cold cache, which
          # takes several minutes. resources/ is gitignored, so without this
          # every run starts from zero. The key changes when an image or the
          # template that processes it changes; `hugo --gc` prunes variants
          # that are no longer referenced.
          path: resources
          key: hugo-resources-${{ runner.os }}-0.154.5-${{ hashFiles('static/images/**', 'assets/images/**', 'layouts/partials/responsive-image.html') }}
          restore-keys: |
            hugo-resources-${{ runner.os }}-0.154.5-

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/hugo' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
