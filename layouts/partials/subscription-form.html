<section class="subscription-form">
  <form
    action="https://navendu.us5.list-manage.com/subscribe/post-json?u=fb9ffeb3ee6bc8aaf1d5b8a98&amp;id=5ff8367bc1&c=?"
    method="post"
    autocomplete="off"
    class="subscribe-form"
  >
    <div class="subscribe-input">
      <input
        type="email"
        name="EMAIL"
        id="email"
        required
        placeholder="Email Address"
        title="Email Address"
      />
    </div>
    <input
      value="Subscribe"
      type="submit"
      class="subscribe-button"
      title="Subscribe"
    />
  </form>
  <div class="subscribe-message">
    Get an occasional dose of tech news, curated content, and uninterrupted musings, delivered directly to your inbox.
  </div>
</section>

<!-- Handle form submission with vanilla JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('.subscribe-form');
    const subscribeButton = form.querySelector('.subscribe-button');
    const subscribeMessage = document.querySelector('.subscribe-message');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Prevent double submissions - disable button immediately
        subscribeButton.disabled = true;
        subscribeButton.setAttribute('aria-disabled', 'true');
        subscribeButton.value = 'Subscribing...';

        const url = form.getAttribute('action');
        const formData = new FormData(form);
        const params = new URLSearchParams(formData).toString();

        // Generate unique callback name to prevent race conditions
        const callbackName = 'mailchimpCallback_' + Date.now();
        var timeoutId;
        var scriptElement;

        // Create unique callback function
        window[callbackName] = function(data) {
            // Clear timeout
            if (timeoutId) {
                clearTimeout(timeoutId);
            }

            // Clean up immediately
            delete window[callbackName];
            if (scriptElement && scriptElement.parentNode) {
                scriptElement.parentNode.removeChild(scriptElement);
            }

            if (data.result === 'success') {
                subscribeButton.value = 'Subscribed!';
                subscribeMessage.innerHTML =
                    "Thank you for subscribing! Please check your inbox for a confirmation email and add me in your contacts to not miss an issue! <a target='_blank' href='https://twitter.com/intent/tweet?url=https%3A%2F%2Fnavendu.me&text=I%20just%20subscribed%20to%20@realPottekkat%27s%20blog%21%20Check%20it%20out%21&hashtags=OpenSource%2CDevelopers%2CDEVCommunity'>Tweet about it</a>!";
                Array.from(form.elements).forEach(function(el) {
                    el.disabled = true;
                });
            } else {
                subscribeButton.value = 'Retry?';
                subscribeButton.disabled = false;
                subscribeButton.removeAttribute('aria-disabled');

                // Sanitize error message to prevent XSS while preserving formatting
                // Mailchimp returns messages like "0 - Error description"
                var errorMsg = data.msg || "Please try again.";
                var tempDiv = document.createElement('div');
                tempDiv.textContent = errorMsg;
                var sanitizedMsg = tempDiv.textContent;

                subscribeMessage.textContent = "There was an error subscribing you to my blog. " + sanitizedMsg + ".";

                form.reset();
            }
        };

        scriptElement = document.createElement('script');
        scriptElement.src = url.replace(/c=\?/, 'c=' + callbackName) + '&' + params;
        document.body.appendChild(scriptElement);

        // Timeout after 10 seconds if no response
        timeoutId = setTimeout(function() {
            delete window[callbackName];
            if (scriptElement && scriptElement.parentNode) {
                scriptElement.parentNode.removeChild(scriptElement);
            }

            // Re-enable button and show error
            subscribeButton.value = 'Retry?';
            subscribeButton.disabled = false;
            subscribeButton.removeAttribute('aria-disabled');
            subscribeMessage.textContent = 'Request timed out. Please try again.';
        }, 10000);

        scriptElement.onerror = function() {
            if (timeoutId) {
                clearTimeout(timeoutId);
            }

            delete window[callbackName];
            if (scriptElement && scriptElement.parentNode) {
                scriptElement.parentNode.removeChild(scriptElement);
            }

            subscribeButton.value = 'Retry?';
            subscribeButton.disabled = false;
            subscribeButton.removeAttribute('aria-disabled');
            subscribeMessage.textContent = 'Network error. Please check your connection and try again.';
            form.reset();
        };
    });
});
</script>
