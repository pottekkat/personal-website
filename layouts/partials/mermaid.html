<script>
  (function () {
    var align = '{{ if site.Params.mermaid.align }}{{ site.Params.mermaid.align }}{{ else }}center{{ end }}';
    var securityLevel = '{{ if site.Params.mermaid.securityLevel }}{{ site.Params.mermaid.securityLevel }}{{ else }}loose{{ end }}';

    // mermaid.min.js is ~900 KB. Loading it with a plain <script> tag made it
    // block the parser on every post that has a diagram. We load it after the
    // page has finished loading instead; everything below is unchanged apart
    // from waiting on that load.
    // Pinned, so a new major version can't restyle every diagram unseen.
    // A new version is a deliberate update, with a new hash.
    var MERMAID_SRC = 'https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js';
    var MERMAID_SRI = 'sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2';

    // Never start the fetch before `load`: a diagram near the top of the page
    // would otherwise put 900 KB of CDN JavaScript in competition with the
    // images and fonts that decide LCP.
    function whenLoaded(fn) {
      if (document.readyState === 'complete') fn();
      else window.addEventListener('load', fn, { once: true });
    }

    var loading = null;
    function loadMermaid() {
      if (loading) return loading;
      loading = new Promise(function (resolve, reject) {
        whenLoaded(function () {
          var s = document.createElement('script');
          s.src = MERMAID_SRC;
          s.integrity = MERMAID_SRI;
          s.crossOrigin = 'anonymous';
          s.async = true;
          s.onload = resolve;
          s.onerror = function (e) {
            // Drop the failed attempt so a later trigger (scroll, theme toggle)
            // can try the CDN again instead of reusing a rejected promise.
            loading = null;
            if (s.parentNode) s.parentNode.removeChild(s);
            reject(e);
          };
          document.head.appendChild(s);
        });
      });
      // Idle and scroll triggers fire and forget; a failed CDN load is
      // retried later, not an error worth reporting.
      loading.catch(function () {});
      return loading;
    }

    function currentTheme() {
      return document.body.classList.contains('dark') ? 'dark' : 'default';
    }

    // Mermaid measures label sizes with getBBox(), which returns 0 inside a
    // display:none container (e.g. an inactive tab), collapsing the diagram. So
    // we only ever render diagrams that are currently laid out, and (re)render
    // the rest when they become visible.
    function isVisible(node) {
      return node.getClientRects().length > 0;
    }

    function config(theme) {
      return {
        startOnLoad: false,
        theme: theme,
        // The look the posts were drawn with. Mermaid 12 changes it (ELK
        // layout, a glow on shapes, 120px label wrap, 120px minimum box);
        // these keep it. minNodeWidth isn't a mermaid 11 option and is
        // ignored until then.
        layout: 'dagre',
        look: 'classic',
        flowchart: { wrappingWidth: 200, minNodeWidth: 0 },
        align: align,
        securityLevel: securityLevel,
      };
    }
    // Snapshot each diagram's original markup before mermaid replaces it with an
    // SVG. Mermaid reads the definition from innerHTML (not textContent), so we
    // capture and restore innerHTML to stay faithful to labels like <br/>.
    var nodes = Array.prototype.slice.call(document.querySelectorAll('.mermaid'));
    var sources = nodes.map(function (node) { return node.innerHTML; });
    if (!nodes.length) return;

    // Serialize renders so a rapid theme toggle or tab reveal can't overlap the
    // async run.
    var pending = Promise.resolve();
    function render(list) {
      list = list.filter(isVisible);
      if (!list.length) return pending;
      pending = pending.then(loadMermaid).then(function () {
        // A render that comes due while the page prints would put the
        // diagram's source on paper. It waits for afterprint instead (below).
        if (document.body.hasAttribute('data-printing')) return;
        // Re-check visibility after the download: a reader who switched tabs
        // while mermaid loaded would otherwise get the now-hidden diagram
        // rendered at getBBox() == 0 -- collapsed, and marked as rendered for
        // this theme, so revealing the tab never repaired it.
        var live = list.filter(isVisible);
        if (!live.length) return;
        var theme = currentTheme();
        live.forEach(function (node) {
          node.innerHTML = sources[nodes.indexOf(node)];
          node.removeAttribute('data-processed');
          node.setAttribute('data-rendered-theme', theme);
        });
        mermaid.initialize(config(theme));
        return mermaid.run({ nodes: live }).then(prepareCopies);
      }).catch(function () {});
      return pending;
    }

    // Paper is always light, and a print can't wait for an async render. A
    // diagram that isn't drawn light when the reader prints -- drawn dark,
    // in a closed tab, or not scrolled to yet -- would print dark or as its
    // source. So each of those gets a light copy, drawn once in idle time and
    // kept hidden right after it; print.css prints the copy in its place.
    function idle() {
      return new Promise(function (resolve) {
        if (window.requestIdleCallback) requestIdleCallback(resolve, { timeout: 2000 });
        else setTimeout(resolve, 200);
      });
    }
    var tried = [];
    function needsCopy(node) {
      var next = node.nextElementSibling;
      return tried.indexOf(node) < 0 &&
        !(next && next.classList.contains('mermaid-print')) &&
        node.getAttribute('data-rendered-theme') !== 'default';
    }
    // One copy at a time, each in the render queue, so a diagram the reader
    // scrolls to waits for at most one copy.
    var preparing = false;
    function prepareCopies() {
      if (preparing) return;
      preparing = true;
      (function next() {
        if (!nodes.some(needsCopy)) { preparing = false; return; }
        idle().then(function () {
          pending = pending.then(function () {
            var node = nodes.filter(needsCopy)[0];
            if (node) return drawCopy(node);
          }).catch(function () {});
          return pending;
        }).then(next);
      })();
    }
    // The copy is drawn off-screen rather than hidden because mermaid
    // measures its labels, and in the post rather than next to the diagram,
    // which may sit in a closed tab. A copy that fails to draw is removed,
    // and the diagram prints inverted instead (print.css).
    function drawCopy(node) {
      tried.push(node);
      var host = node.closest('.post-content') || document.body;
      var copy = document.createElement('div');
      copy.className = 'mermaid mermaid-print';
      copy.innerHTML = sources[nodes.indexOf(node)];
      copy.style.cssText = 'position:absolute;left:-10000px;top:0;width:' + (node.clientWidth || host.clientWidth) + 'px';
      host.appendChild(copy);
      mermaid.initialize(config('default'));
      return mermaid.run({ nodes: [copy] }).then(function () {
        copy.removeAttribute('style');
        copy.hidden = true;
        node.after(copy);
      }, function () {
        copy.remove();
      });
    }

    // Render the visible diagrams that aren't already drawn for the current
    // theme. Hidden diagrams (inactive tabs) are skipped and picked up later.
    function renderStale(list) {
      // While printing, the page's theme is switched to light for the paper
      // (footer.html), but a re-render is async and would replace the
      // diagram with its source before the page is printed. Paper gets the
      // light copies instead (prepareCopies).
      if (document.body.hasAttribute('data-printing')) return pending;
      var theme = currentTheme();
      var todo = list.filter(function (node) {
        return isVisible(node) && node.getAttribute('data-rendered-theme') !== theme;
      });
      return todo.length ? render(todo) : pending;
    }

    // Once the page is loaded, pull mermaid in during idle time whether or not a
    // diagram is on screen. A reader who scrolls fast would otherwise sit in
    // front of the raw diagram source while 900 KB downloads. This costs
    // nothing on the critical path, and every page carrying this partial has
    // `mermaid: true` set precisely because it has a diagram to show.
    function preload() {
      loadMermaid().then(prepareCopies, function () {});
    }
    whenLoaded(function () {
      if (window.requestIdleCallback) requestIdleCallback(preload, { timeout: 3000 });
      else setTimeout(preload, 1000);
    });

    // Still observe: a reader already parked at a diagram should not wait for
    // the idle callback, and this is what triggers the first render.
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            var target = e.target;
            loadMermaid();
            // Only stop observing once the diagram is actually drawn. If the
            // CDN request failed, the node keeps its observer so scrolling
            // back re-triggers the (now retryable) load.
            renderStale([target]).then(function () {
              if (target.querySelector('svg')) io.unobserve(target);
            });
          }
        });
      }, { rootMargin: '800px 0px' });
      nodes.forEach(function (node) { io.observe(node); });
    } else {
      loadMermaid();
    }

    // ResizeObserver fires when a diagram first gets a box on load and when an
    // inactive tab reveals it (content size 0 -> N) -- independent of scroll
    // position, which is why we don't use IntersectionObserver alone (it only
    // fires on viewport crossings, so it misses tabs toggled while scrolled
    // off-screen). This drives re-theming of diagrams revealed inside tabs.
    var ro = new ResizeObserver(function (entries) {
      renderStale(entries.map(function (e) { return e.target; }));
    });
    nodes.forEach(function (node) { ro.observe(node); });

    // On theme toggle, re-render the currently-visible diagrams now; hidden ones
    // keep a stale data-rendered-theme and re-render (via the ResizeObserver
    // above) when their tab is next revealed.
    var lastTheme = currentTheme();
    new MutationObserver(function () {
      if (document.body.hasAttribute('data-printing')) return;
      var theme = currentTheme();
      if (theme !== lastTheme) {
        lastTheme = theme;
        renderStale(nodes);
      }
    }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

    // Catch up on what printing held back, once footer.html has put the
    // theme back.
    window.addEventListener('afterprint', function () {
      setTimeout(function () {
        lastTheme = currentTheme();
        renderStale(nodes);
      });
    });
  })();
</script>
