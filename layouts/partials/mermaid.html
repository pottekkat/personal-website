<script>
  (function () {
    var align = '{{ if site.Params.mermaid.align }}{{ site.Params.mermaid.align }}{{ else }}center{{ end }}';
    var securityLevel = '{{ if site.Params.mermaid.securityLevel }}{{ site.Params.mermaid.securityLevel }}{{ else }}loose{{ end }}';

    // mermaid.min.js is ~900 KB. Loading it with a plain <script> tag made it
    // block the parser on every post that has a diagram. We load it after the
    // page has finished loading instead; everything below is unchanged apart
    // from waiting on that load.
    var MERMAID_SRC = 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js';

    // Never start the fetch before `load`: a diagram near the top of the page
    // would otherwise put 900 KB of CDN JavaScript in competition with the
    // images and fonts that decide LCP.
    function whenLoaded(fn) {
      if (document.readyState === 'complete') fn();
      else window.addEventListener('load', fn, { once: true });
    }

    var loading = null;
    function loadMermaid() {
      if (loading) return loading;
      loading = new Promise(function (resolve, reject) {
        whenLoaded(function () {
          var s = document.createElement('script');
          s.src = MERMAID_SRC;
          s.async = true;
          s.onload = resolve;
          s.onerror = function (e) {
            // Drop the failed attempt so a later trigger (scroll, theme toggle)
            // can try the CDN again instead of reusing a rejected promise.
            loading = null;
            if (s.parentNode) s.parentNode.removeChild(s);
            reject(e);
          };
          document.head.appendChild(s);
        });
      });
      return loading;
    }

    function currentTheme() {
      return document.body.classList.contains('dark') ? 'dark' : 'default';
    }

    // Mermaid measures label sizes with getBBox(), which returns 0 inside a
    // display:none container (e.g. an inactive tab), collapsing the diagram. So
    // we only ever render diagrams that are currently laid out, and (re)render
    // the rest when they become visible.
    function isVisible(node) {
      return node.getClientRects().length > 0;
    }

    // Snapshot each diagram's original markup before mermaid replaces it with an
    // SVG. Mermaid reads the definition from innerHTML (not textContent), so we
    // capture and restore innerHTML to stay faithful to labels like <br/>.
    var nodes = Array.prototype.slice.call(document.querySelectorAll('.mermaid'));
    var sources = nodes.map(function (node) { return node.innerHTML; });
    if (!nodes.length) return;

    // Serialize renders so a rapid theme toggle or tab reveal can't overlap the
    // async run.
    var pending = Promise.resolve();
    function render(list) {
      list = list.filter(isVisible);
      if (!list.length) return pending;
      pending = pending.then(loadMermaid).then(function () {
        var theme = currentTheme();
        list.forEach(function (node) {
          node.innerHTML = sources[nodes.indexOf(node)];
          node.removeAttribute('data-processed');
          node.setAttribute('data-rendered-theme', theme);
        });
        mermaid.initialize({
          startOnLoad: false,
          theme: theme,
          align: align,
          securityLevel: securityLevel,
        });
        return mermaid.run({ nodes: list });
      }).catch(function () {});
      return pending;
    }

    // Render the visible diagrams that aren't already drawn for the current
    // theme. Hidden diagrams (inactive tabs) are skipped and picked up later.
    function renderStale(list) {
      var theme = currentTheme();
      var todo = list.filter(function (node) {
        return isVisible(node) && node.getAttribute('data-rendered-theme') !== theme;
      });
      if (todo.length) render(todo);
    }

    // Once the page is loaded, pull mermaid in during idle time whether or not a
    // diagram is on screen. A reader who scrolls fast would otherwise sit in
    // front of the raw diagram source while 900 KB downloads. This costs
    // nothing on the critical path, and every page carrying this partial has
    // `mermaid: true` set precisely because it has a diagram to show.
    whenLoaded(function () {
      if (window.requestIdleCallback) requestIdleCallback(loadMermaid, { timeout: 3000 });
      else setTimeout(loadMermaid, 1000);
    });

    // Still observe: a reader already parked at a diagram should not wait for
    // the idle callback, and this is what triggers the first render.
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            io.unobserve(e.target);
            loadMermaid();
            renderStale([e.target]);
          }
        });
      }, { rootMargin: '800px 0px' });
      nodes.forEach(function (node) { io.observe(node); });
    } else {
      loadMermaid();
    }

    // ResizeObserver fires when a diagram first gets a box on load and when an
    // inactive tab reveals it (content size 0 -> N) -- independent of scroll
    // position, which is why we don't use IntersectionObserver alone (it only
    // fires on viewport crossings, so it misses tabs toggled while scrolled
    // off-screen). This drives re-theming of diagrams revealed inside tabs.
    var ro = new ResizeObserver(function (entries) {
      renderStale(entries.map(function (e) { return e.target; }));
    });
    nodes.forEach(function (node) { ro.observe(node); });

    // On theme toggle, re-render the currently-visible diagrams now; hidden ones
    // keep a stale data-rendered-theme and re-render (via the ResizeObserver
    // above) when their tab is next revealed.
    var lastTheme = currentTheme();
    new MutationObserver(function () {
      var theme = currentTheme();
      if (theme !== lastTheme) {
        lastTheme = theme;
        renderStale(nodes);
      }
    }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  })();
</script>
