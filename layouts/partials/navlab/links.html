{{- $page := . }}
<ul class="nl-links">
    {{- range site.Menus.main }}
    {{- $url := (cond (strings.HasSuffix .URL "/") .URL (printf "%s/" .URL)) | absLangURL }}
    {{- $here := eq $url ($page.Permalink | absLangURL) }}
    <li><a href="{{ .URL | relLangURL }}"{{ if $here }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
    {{- end }}
</ul>
